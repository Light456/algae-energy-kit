<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Algae Energy Kit in 3D</title>
<link rel="preload" as="image" href="slides/slide-01.jpg" fetchpriority="high">
<script>document.documentElement.dataset.mode = location.hash === '#model' ? 'model' : 'slides';</script>
<meta name="description" content="Spin the Algae Energy Kit in 3D and scroll through the chamber, electrodes, voltmeter and exploded view.">
<!-- Preview locally:  python3 -m http.server 8000  then open http://localhost:8000/viewer.html -->
<style>
  :root {
    color-scheme: light;
    --bg: #e6e9e6; --surface: #ffffff; --text: #17241a; --muted: #47574c; --border: #c3cec4; --accent: #1f6b2c;
    --bar: 64px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #track { position: relative; }
  #stage { position: sticky; top: 0; height: 100vh; height: 100svh; min-height: 460px; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; visibility: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  #scene:focus-visible { outline-offset: -6px; }
  .grabbing #scene { cursor: grabbing; }
  .ready #scene { visibility: visible; }
  .failed #scene, .failed .controls, .failed #hint, .failed .tabs { display: none; }

  .panel { position: absolute; left: 50%; transform: translateX(-50%); top: 84px; padding: 4px 16px; border-radius: 12px; background: rgba(230, 233, 230, .9); width: max-content; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
  .panel:not(:first-of-type) { opacity: 0; visibility: hidden; }
  .panel h1, .panel h2 { margin: 0; font-size: clamp(26px, 3vw, 40px); line-height: 1.1; letter-spacing: -.015em; text-wrap: balance; }
  .panel h1 { font-family: "Times New Roman", Times, serif; letter-spacing: 0; }
  @media (min-width: 900px) { .panel h1 { white-space: nowrap; } }

  #status, #hint { position: absolute; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 0; padding: 8px 16px; font-size: 14px; text-align: center; pointer-events: none; }
  #status { top: 96px; max-width: calc(100% - 32px); width: max-content; }
  #hint { bottom: calc(var(--bar) + 16px); white-space: nowrap; opacity: 0; transition: opacity .4s; }
  .ready #hint { opacity: 1; }
  .ready #hint.gone { opacity: 0; }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 max(40px, 4vw); }
  .tabs, .controls { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button[aria-current] { font-weight: bold; }


  @media (max-width: 899px) {
    :root { --bar: 112px; }
    .panel h1, .panel h2 { font-size: 26px; margin-bottom: 4px; }
    .bar { flex-direction: column; justify-content: flex-end; gap: 4px; padding: 0 8px 8px; }
    .tabs { width: 100%; justify-content: center; order: 2; }
    #status { top: auto; bottom: calc(var(--bar) + 16px); }
    #hint { bottom: calc(var(--bar) + 8px); }
  }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }

  #mode { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
  #mode button { font-size: 22px; padding: 10px 28px; white-space: nowrap; }
  @media (max-width: 899px) { #mode button { font-size: 18px; padding: 8px 18px; } }
  [data-mode="model"] #show-model, [data-mode="slides"] #show-deck { font-weight: bold; }
  #deck { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 96px 16px 16px; }
  #deck[hidden] { display: none; }
  [data-mode="slides"] #track, [data-mode="model"] #deck { display: none; }   /* right view from the first frame */
  #slide { display: block; width: 100%; max-width: 1600px; height: auto; max-height: calc(100svh - 170px); object-fit: contain; background: #fff; border: 1px solid var(--border); }
  .deck-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; font-size: 14px; }
  @media (max-width: 899px) { .panel { top: 72px; } }
</style>
</head>
<body>
<main>
  <div id="mode" role="group" aria-label="Show">
    <button type="button" id="show-model" aria-pressed="false">3D model</button>
    <button type="button" id="show-deck" aria-pressed="true">Slide deck</button>
  </div>

  <div id="track">
    <div id="stage">
      <canvas id="scene" tabindex="0" role="img" aria-label="Interactive 3D model of the Algae Energy Kit. Arrow keys rotate, plus and minus zoom." aria-describedby="hint"></canvas>

      <section class="panel"><h1>Algae Energy Kit<br>3D Rendered in Blender</h1></section>
      <section class="panel"><h2>Chamber</h2></section>
      <section class="panel"><h2>Electrodes</h2></section>
      <section class="panel"><h2>Voltmeter</h2></section>
      <section class="panel"><h2>Overview</h2></section>

      <p id="status" role="status">Loading 3D model</p>
      <noscript><p class="nojs">Turn on JavaScript to see the 3D model.</p></noscript>
      <p id="hint">Drag to spin</p>

      <div class="bar">
        <nav class="tabs" aria-label="Views">
          <button type="button" aria-current="true">Kit</button><button type="button">Chamber</button><button type="button">Electrodes</button><button type="button">Voltmeter</button><button type="button">Exploded</button>
        </nav>
        <div class="controls" role="group" aria-label="3D controls">
          <button type="button" id="spin" aria-pressed="false"><span>Spin</span></button>
          <button type="button" id="out" aria-label="Zoom out">&minus;</button>
          <button type="button" id="in" aria-label="Zoom in">+</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <section id="deck" aria-label="Slide deck">
    <img id="slide" src="slides/slide-01.jpg" width="1600" height="900" alt="" fetchpriority="high">
    <div class="deck-bar">
      <button type="button" id="prev">Previous</button>
      <span id="count" aria-live="polite">Slide 1 of 22</span>
      <button type="button" id="next">Next</button>
      <a href="slides/microbial-fuel-cells.pdf">Download the slides (PDF)</a>
    </div>
  </section>
</main>
<script>
(() => {
  // Slide deck: one image per page of slides/microbial-fuel-cells.pdf, titles for alt text.
  const titles = [
    "Microbial Fuel Cells as Low-Cost Power Sources for Agricultural Sensors",
    "Why Soil Sensors Need a Different Power Source",
    "How a Microbial Fuel Cell Works",
    "What Earlier Studies Found",
    "Research Question",
    "The 6 Configurations Tested",
    "How the Cells Were Built",
    "Electrode Sizes and Materials",
    "How Voltage Was Measured",
    "Peak Voltage by Configuration",
    "Peak Voltage, Stability and Internal Resistance",
    "Voltage Over 48 Hours",
    "Internal Resistance by Configuration",
    "What Worked Best",
    "Why These Choices Worked",
    "Can One Cell Power a Sensor?",
    "Limitations",
    "Conclusion",
    "Next Steps",
    "References (1 of 2)",
    "References (2 of 2)",
    "Thank You"
  ];
  const $ = (id) => document.getElementById(id);
  const track = $('track'), deck = $('deck'), img = $('slide'), count = $('count');
  const showModel = $('show-model'), showDeck = $('show-deck');
  const src = (i) => 'slides/slide-' + String(i + 1).padStart(2, '0') + '.jpg';
  let n = 0;

  function go(i) {
    n = Math.max(0, Math.min(titles.length - 1, i));
    img.src = src(n);
    img.alt = 'Slide ' + (n + 1) + ' of ' + titles.length + ': ' + titles[n];
    count.textContent = 'Slide ' + (n + 1) + ' of ' + titles.length;
    $('prev').disabled = n === 0;
    $('next').disabled = n === titles.length - 1;
    for (const k of [n + 1, n - 1]) if (k >= 0 && k < titles.length) new Image().src = src(k);
  }

  function mode(slides, push) {
    document.documentElement.dataset.mode = slides ? 'slides' : 'model';
    deck.hidden = !slides;
    track.hidden = slides;
    showModel.setAttribute('aria-pressed', String(!slides));
    showDeck.setAttribute('aria-pressed', String(slides));
    if (push) history.replaceState(null, '', slides ? location.pathname + location.search : '#model');
    scrollTo(0, 0);
  }

  showModel.addEventListener('click', () => mode(false, true));
  showDeck.addEventListener('click', () => mode(true, true));
  $('prev').addEventListener('click', () => go(n - 1));
  $('next').addEventListener('click', () => go(n + 1));
  addEventListener('keydown', (e) => {
    if (deck.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(n - 1);
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') go(n + 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(titles.length - 1);
    else return;
    e.preventDefault();
  });
  let x0 = null;
  img.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
  img.addEventListener('pointerup', (e) => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) go(n + (e.clientX < x0 ? 1 : -1)); x0 = null; });

  go(0);
  mode(location.hash !== '#model', false);       // the slide deck is the default view
})();
</script>
<script src="viewer/viewer.js" defer></script>
</body>
</html>
